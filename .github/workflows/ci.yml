name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # Backend (Node + Prisma). Os testes de integração sobem Postgres via
      # testcontainers — o runner do GitHub já tem Docker.
      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Install frontend
        run: npm ci

      - name: Build frontend
        run: npm run build
